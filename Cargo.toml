[package]
name = "darkbio-ark"
version = "0.3.5"
authors = ["Péter Szilágyi <peter@dark.bio>"]
description = "Command line interface to Ark enclaves"
repository = "https://github.com/dark-bio/cli"
homepage = "https://dark.bio"
categories = ["command-line-utilities", "hardware-support"]
keywords = ["ark", "dark-bio", "cli", "usb", "enclave"]
license = "BSD-3-Clause"
edition = "2024"
rust-version = "1.95"

# Internal connection library, released only as part of the CLI.
[lib]
name = "darkbio_connect"
path = "connect/src/lib.rs"
doc = false

[[bin]]
name = "ark"
path = "src/main.rs"

[[example]]
name = "winget"
path = ".github/packaging/winget/main.rs"
test = true

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.60", features = ["derive"] }
darkbio-crypto = { version = "0.18.2", features = ["cbor", "xdsa"] }
darkbio-trust = { version = "0.5.1", features = ["release", "staging", "develop"] }
darkbio-wire = "0.10.0"
hex = "0.4.3"
console = "0.15.11"
base64 = "0.23.1"
clap_complete = "4.5"
directories = "6"
mio = { version = "1.2", features = ["os-poll", "net"] }
nusb = "0.2.7"
qrcode = { version = "0.14", default-features = false }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3.23"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
semver = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# Firmware uploads push megabytes through the crypto, which crawls unoptimized,
# so dependencies build optimized under the dev profile too. The CLI and its
# connection library stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
