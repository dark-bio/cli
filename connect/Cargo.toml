[package]
name = "darkbio-connect"
version = "0.1.0"
authors = ["Péter Szilágyi <peter@dark.bio>"]
description = "Client library for Ark enclaves"
repository = "https://github.com/dark-bio/cli"
documentation = "https://docs.rs/darkbio-connect"
categories = ["network-programming", "hardware-support"]
keywords = ["ark", "dark-bio", "enclave", "usb", "websocket"]
license = "BSD-3-Clause"
edition = "2024"
rust-version = "1.95"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
release = ["darkbio-trust/release"]
staging = ["darkbio-trust/staging"]
develop = ["darkbio-trust/develop"]

[dependencies]
base64 = "0.23.1"
darkbio-crypto = { version = "0.18.2", features = ["cbor", "xdsa"] }
darkbio-trust = "0.5.1"
darkbio-wire = "0.9.0"
hex = "0.4.3"
nusb = "0.2.7"
mio = { version = "1.2", features = ["os-poll", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2.0"
tracing = "0.1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
