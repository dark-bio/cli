[package]
name = "darkbio-connect"
version = "0.1.0"
authors = ["Péter Szilágyi <peter@dark.bio>"]
description = "Connections to Ark enclaves from host processes"
license = "BSD-3-Clause"
edition = "2024"

[features]
default = []
release = ["darkbio-trust/release"]
staging = ["darkbio-trust/staging"]
develop = ["darkbio-trust/develop"]

[dependencies]
darkbio-crypto = { version = "0.18.0", features = ["xdsa"] }
darkbio-trust = "0.3.0"
darkbio-wire = "0.7.0"
nusb = "0.2.7"
mio = { version = "1.2", features = ["os-poll", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
tungstenite = "0.30"
ureq = { version = "3.4", default-features = false }

[dev-dependencies]
darkbio-crypto = { version = "0.18.0", features = ["cwt", "xdsa"] }
prost = "0.14"
