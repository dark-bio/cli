name: Publish

on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      formula: ${{ steps.version.outputs.formula }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select the release version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "darkbio-ark") | .version')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
              echo "error: tag $GITHUB_REF_NAME does not match Cargo version $version" >&2
              exit 1
            fi
          else
            if git show-ref --verify --quiet "refs/tags/v$version"; then
              echo "error: v$version is already tagged; bump the version in Cargo.toml before building develop" >&2
              exit 1
            fi
            version="$version-dev.$GITHUB_RUN_NUMBER"
            if git show-ref --verify --quiet "refs/tags/v$version"; then
              echo "error: develop tag v$version already exists" >&2
              exit 1
            fi
          fi
          prerelease=false
          formula=ark-cli
          if [[ "$version" == *-* ]]; then
            prerelease=true
            formula=ark-cli-dev
          fi
          printf 'version=%s\ntag=v%s\nprerelease=%s\nformula=%s\n' \
            "$version" "$version" "$prerelease" "$formula" >> "$GITHUB_OUTPUT"

  tests:
    uses: ./.github/workflows/ci.yml

  audit:
    uses: ./.github/workflows/audit.yml

  build:
    needs: [ version ]
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      ARK_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      matrix:
        include:
          - os: macOS-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            suffix: ''
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-amd64
            suffix: ''
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            suffix: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
            suffix: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-amd64
            suffix: '.exe'

    steps:
      - uses: actions/checkout@v7

      - name: Set the build version
        shell: bash
        run: |
          for file in Cargo.toml Cargo.lock; do
            awk -v version="$ARK_VERSION" '
              /^name = "darkbio-ark"$/ { package = 1 }
              package && /^version = / {
                $0 = "version = \"" version "\""
                package = 0
                changed++
              }
              { print }
              END { if (changed != 1) exit 1 }
            ' "$file" > "$file.release"
            mv "$file.release" "$file"
          done

      - name: Build
        run: cargo build --release --locked --bin ark --target ${{ matrix.target }}

      - name: Check the executable
        shell: bash
        run: target/${{ matrix.target }}/release/ark${{ matrix.suffix }} --version

      - name: Prepare the executable
        shell: bash
        run: |
          mkdir -p release
          cp target/${{ matrix.target }}/release/ark${{ matrix.suffix }} "release/ark-$ARK_VERSION-${{ matrix.platform }}${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: release/ark-${{ env.ARK_VERSION }}-${{ matrix.platform }}${{ matrix.suffix }}
          if-no-files-found: error
          overwrite: true

  prepare:
    needs: [ version, build, audit ]
    runs-on: ubuntu-latest
    env:
      ARK_VERSION: ${{ needs.version.outputs.version }}
      ARK_FORMULA: ${{ needs.version.outputs.formula }}

    steps:
      - uses: actions/checkout@v7

      - name: Check crate packaging
        if: needs.version.outputs.prerelease == 'false'
        run: cargo publish --dry-run --locked

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: release

      - name: Generate release metadata
        run: |
          version="$ARK_VERSION"
          arm64=$(sha256sum "release/ark-$version-macos-arm64" | cut -d ' ' -f 1)
          amd64=$(sha256sum "release/ark-$version-macos-amd64" | cut -d ' ' -f 1)
          licenses=$(sha256sum release/LICENSES.txt | cut -d ' ' -f 1)
          mkdir -p metadata
          sed "s/@VERSION@/$version/g" .github/packaging/shell/install.sh > metadata/ark-installer.sh
          sh -n metadata/ark-installer.sh
          class=ArkCli
          conflict=ark-cli-dev
          if [[ "$ARK_FORMULA" == ark-cli-dev ]]; then
            class=ArkCliDev
            conflict=ark-cli
          fi
          sed -e "s/@VERSION@/$version/g" -e "s/@ARM64_SHA256@/$arm64/g" -e "s/@AMD64_SHA256@/$amd64/g" \
            -e "s/@LICENSES_SHA256@/$licenses/g" -e "s/@CLASS@/$class/g" -e "s/@CONFLICT@/$conflict/g" \
            .github/packaging/homebrew/ark-cli.rb > "metadata/$ARK_FORMULA.rb"
          ruby -c "metadata/$ARK_FORMULA.rb"

      - name: Generate winget manifests
        if: needs.version.outputs.prerelease == 'false'
        run: cargo run --locked --example winget -- "$ARK_VERSION" "release/ark-$ARK_VERSION-windows-amd64.exe" --output metadata/winget

      - uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: metadata/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [ version, tests, prepare ]
    if: github.ref_type == 'tag' && needs.version.outputs.prerelease == 'false'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for OIDC token exchange

    steps:
      - uses: actions/checkout@v7

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: [ version, tests, prepare ]
    runs-on: ubuntu-latest
    env:
      ARK_TAG: ${{ needs.version.outputs.tag }}
      ARK_PRERELEASE: ${{ needs.version.outputs.prerelease }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: licenses
          path: release

      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: metadata

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=()
          if [[ "$ARK_PRERELEASE" == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flags+=(--verify-tag)
          fi
          gh release create "$ARK_TAG" release/* metadata/ark-installer.sh \
            --target "$GITHUB_SHA" --generate-notes --title "Ark CLI $ARK_TAG" "${flags[@]}"

  homebrew:
    needs: [ version, release ]
    runs-on: ubuntu-latest
    environment: github-action-releaser
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    env:
      ARK_TAG: ${{ needs.version.outputs.tag }}
      ARK_FORMULA: ${{ needs.version.outputs.formula }}

    steps:
      - uses: actions/checkout@v7
        with:
          repository: dark-bio/homebrew-tap
          # Write deploy key on the tap repository.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: ${{ runner.temp }}/metadata

      - name: Commit the formula
        run: |
          mkdir -p Formula
          # An older run may finish or be retried after a newer release.
          if [[ -f "Formula/$ARK_FORMULA.rb" ]]; then
            newer=$(ruby -r rubygems -e '
              versions = ARGV.map { |file| Gem::Version.new(File.read(file).match(/^  version "([^"]+)"$/)[1]) }
              puts versions[0] > versions[1]
            ' "$RUNNER_TEMP/metadata/$ARK_FORMULA.rb" "Formula/$ARK_FORMULA.rb")
            if [[ "$newer" != true ]]; then
              echo "$ARK_FORMULA is already at this version or newer"
              exit 0
            fi
          fi
          cp "$RUNNER_TEMP/metadata/$ARK_FORMULA.rb" "Formula/$ARK_FORMULA.rb"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Formula/$ARK_FORMULA.rb"
          if ! git diff --cached --quiet; then
            git commit -m "$ARK_FORMULA ${ARK_TAG#v}"
            git pull --rebase
            git push
          fi

  winget:
    needs: [ version, release ]
    # Enable in the follow-up after configuring the submission bot's OAuth token.
    if: ${{ false && needs.version.outputs.prerelease == 'false' }}
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: metadata

      - name: Install the manifest submitter
        run: Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile "$env:RUNNER_TEMP/wingetcreate.exe"

      - name: Validate and submit the manifests
        env:
          # OAuth access for the bot. Deploy keys cannot call the pull request API.
          WINGET_SUBMISSION_TOKEN: ${{ secrets.WINGET_SUBMISSION_TOKEN }}
        run: |
          if (-not $env:WINGET_SUBMISSION_TOKEN) {
            throw 'WINGET_SUBMISSION_TOKEN is required'
          }
          & "$env:RUNNER_TEMP/wingetcreate.exe" submit --no-open --token $env:WINGET_SUBMISSION_TOKEN metadata/winget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
