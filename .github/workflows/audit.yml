name: audit

on:
  workflow_call:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Check dependencies against the RustSec advisory database
        run: cargo audit

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check dependency licenses against the allowlist
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features --config .cargo/deny.toml
          command: check licenses

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli

      - name: Generate dependency notices
        run: cargo about generate --locked --fail --config .github/packaging/licenses/about.toml .github/packaging/licenses/notices.hbs --output-file "$RUNNER_TEMP/LICENSES.txt"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: licenses
          path: ${{ runner.temp }}/LICENSES.txt
          if-no-files-found: error
          overwrite: true
